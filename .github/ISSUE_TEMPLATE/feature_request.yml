name: Feature request
description: Sugira uma ideia ou melhoria para a Bíblia PRO
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado pela sugestão! Descreva o problema que você quer resolver e a
        solução imaginada.

  - type: textarea
    id: problem
    attributes:
      label: Problema ou necessidade
      description: Qual dificuldade isso resolve?
      placeholder: Durante o culto, preciso alternar rapidamente entre duas pregações.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solução proposta
      description: Como você imagina que deveria funcionar?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
      description: Outras formas de resolver o mesmo problema.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Screenshots, exemplos, links ou qualquer detalhe útil.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmações
      options:
        - label: Procurei issues existentes e não encontrei uma sugestão igual.
          required: true
