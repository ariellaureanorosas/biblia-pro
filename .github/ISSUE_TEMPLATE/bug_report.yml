name: Bug report
description: Reporte um comportamento incorreto da Bíblia PRO
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar! Antes de continuar, procure uma issue existente
        com o mesmo problema.

  - type: textarea
    id: description
    attributes:
      label: Descrição do problema
      description: O que aconteceu? Seja específico.
      placeholder: Ao projetar um favorito com vários versículos, o texto aparece cortado.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Como podemos reproduzir o problema?
      placeholder: |
        1. Abra o painel Bíblia PRO
        2. Selecione João 3:16-17
        3. Clique em favoritar
        4. Projete o favorito
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
      placeholder: O trecho inteiro deve aparecer na mesma tela.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamento observado
      placeholder: Apenas o primeiro versículo aparece.
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Versão da Bíblia PRO
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: spresenter-version
    attributes:
      label: Versão do Spresenter
      placeholder: "0.3.45"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Sistema operacional
      options:
        - Windows
        - macOS
        - Linux
        - Outro
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / capturas
      description: Cole mensagens de erro ou anexe screenshots. Evite dados sensíveis.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Confirmações
      options:
        - label: Procurei issues existentes e não encontrei uma igual.
          required: true
        - label: Estou usando a versão mais recente publicada.
          required: true
