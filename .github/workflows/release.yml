name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publicar release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Verificar tipos
        run: npm run typecheck

      - name: Empacotar
        run: npm run package

      - name: Validar tag x versão do manifesto
        shell: bash
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME não corresponde à versão $manifest_version do manifest.json"
            exit 1
          fi

      - name: Ler nome do plugin
        id: manifest
        run: |
          echo "slug=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Preparar notas da release
        id: notes
        shell: bash
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$file" ]; then
            echo "Sem notas dedicadas; usando notas geradas automaticamente."
            exit 0
          fi
          zip="release/${{ steps.manifest.outputs.slug }}-${{ steps.manifest.outputs.version }}.zip"
          sha="$(sha256sum "$zip" | cut -d' ' -f1)"
          size="$(stat -c%s "$zip")"
          body="$RUNNER_TEMP/release-notes.md"
          sed -e "s/{{SHA256}}/$sha/g" -e "s/{{SIZE}}/$size/g" "$file" > "$body"
          echo "body_path=$body" >> "$GITHUB_OUTPUT"
          echo "Notas: $file (sha256=$sha, size=$size)"

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Bíblia PRO ${{ steps.manifest.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.body_path == '' }}
          files: release/${{ steps.manifest.outputs.slug }}-${{ steps.manifest.outputs.version }}.zip
          fail_on_unmatched_files: true
