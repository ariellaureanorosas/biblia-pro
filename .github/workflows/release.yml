name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publicar release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Empacotar
        run: npm run package

      - name: Validar tag x versão do manifesto
        shell: bash
        run: |
          manifest_version="$(node -p "require('./manifest.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME não corresponde à versão $manifest_version do manifest.json"
            exit 1
          fi

      - name: Ler nome do plugin
        id: manifest
        run: |
          echo "id=$(node -p "require('./manifest.json').id")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Bíblia PRO ${{ steps.manifest.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: release/${{ steps.manifest.outputs.id }}-${{ steps.manifest.outputs.version }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
